name: Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest feedparser pydantic>=2.0.0 google-cloud-secret-manager opentelemetry-api

    - name: Run Unit & Golden Dataset Evaluation Harness
      env:
        AGENT_HITL_APPROVED: "True"
        GOOGLE_CLOUD_PROJECT: "mock-project"
      run: |
        pytest news-digest-agent/test_agent.py -v

    - name: Terraform Validate
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
    - name: Terraform Init & Validate
      run: |
        cd news-digest-agent
        terraform init -backend=false
        terraform validate